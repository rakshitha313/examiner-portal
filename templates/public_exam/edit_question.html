<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Question</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 15px;
}

.container{
    width:100%;
    max-width:800px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:28px;
    backdrop-filter:blur(14px);
    padding:30px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

h2{
    color:white;
    font-size:28px;
    font-weight:800;
}

.back-btn{
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,0.1);
    padding:10px 15px;
    border-radius:12px;
}

.form-box{
    background:white;
    border-radius:20px;
    padding:25px;
}

form p{
    margin-bottom:16px;
}

form label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-size:14px;
    font-weight:600;
}

form input,
form textarea,
form select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:14px;
    background:#f8fafc;
    outline:none;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#f59e0b,#f97316);
    color:white;
    font-weight:800;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <h2>Edit Question</h2>
        <a href="{% url 'add-question' question.exam.id %}" class="back-btn">← Back</a>
    </div>

    <div class="form-box">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="submit-btn">Update Question</button>
        </form>
    </div>

</div>

</body>
</html>
