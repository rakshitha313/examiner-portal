<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;
            min-height:100vh;
            background: linear-gradient(135deg,#0f172a,#1e293b,#312e81);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px 15px;
        }

        .container{
            width:100%;
            max-width:850px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:30px;
            backdrop-filter:blur(18px);
            box-shadow:0 25px 60px rgba(0,0,0,0.35);
            padding:30px;
        }

        .card{
            background:white;
            border-radius:24px;
            padding:34px 28px;
            text-align:center;
        }

        .icon{
            width:82px;
            height:82px;
            border-radius:50%;
            background: linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:34px;
            margin:0 auto 18px;
            box-shadow:0 14px 30px rgba(79,70,229,0.25);
        }

        h1{
            font-size:30px;
            font-weight:800;
            color:#0f172a;
            margin-bottom:8px;
        }

        .subtitle{
            color:#64748b;
            font-size:14px;
            margin-bottom:22px;
        }

        .exam-title{
            font-size:22px;
            font-weight:800;
            color:#1e293b;
            margin-bottom:22px;
        }

        .score-box{
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            border:1px solid #ddd6fe;
            border-radius:20px;
            padding:24px;
            margin:20px 0;
        }

        .score-label{
            color:#6366f1;
            font-size:14px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
            margin-bottom:10px;
        }

        .score{
            font-size:48px;
            font-weight:800;
            color:#4f46e5;
            line-height:1;
        }

        .status{
            margin-top:18px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:10px 16px;
            border-radius:999px;
            background:rgba(16,185,129,0.12);
            color:#10b981;
            font-size:13px;
            font-weight:800;
            border:1px solid rgba(16,185,129,0.2);
            text-transform:uppercase;
            letter-spacing:0.6px;
        }

        .action-row{
            display:flex;
            justify-content:center;
            gap:12px;
            flex-wrap:wrap;
            margin-top:24px;
        }

        .btn{
            display:inline-block;
            padding:12px 18px;
            border-radius:14px;
            font-weight:700;
            text-decoration:none;
            transition:0.25s ease;
        }

        .btn-primary{
            background: linear-gradient(135deg,#4f46e5,#7c3aed);
            color:white;
            box-shadow:0 12px 24px rgba(79,70,229,0.24);
        }

        .btn-primary:hover{
            transform:translateY(-2px);
        }

        .btn-secondary{
            background:#e2e8f0;
            color:#0f172a;
        }

        .btn-secondary:hover{
            background:#cbd5e1;
        }

        @media(max-width:600px){
            .card{
                padding:26px 18px;
            }

            h1{
                font-size:24px;
            }

            .exam-title{
                font-size:18px;
            }

            .score{
                font-size:38px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <div class="icon">🏆</div>

        <h1>Exam Completed</h1>
        <div class="subtitle">Your exam has been submitted successfully.</div>

        <div class="exam-title">{{ exam.title }}</div>

        <div class="score-box">
            <div class="score-label">Your Score</div>
            <div class="score">{{ attempt.score }}</div>
        </div>

        {% if attempt.is_submitted %}
            <div class="status">Submitted Successfully</div>
        {% endif %}

        <div class="action-row">
            <a href="/exam/{{ exam.exam_code }}/" class="btn btn-secondary">Back</a>
            <a href="/examiner/login/" class="btn btn-primary">Examiner Portal</a>
        </div>

    </div>
</div>

</body>
</html>
