<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Results</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Inter',sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    color:white;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h2{
    margin-bottom:20px;
}

.table{
    width:100%;
    border-collapse:collapse;
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    overflow:hidden;
}

.table th, .table td{
    padding:12px;
    text-align:left;
}

.table th{
    background:rgba(255,255,255,0.15);
}

.table tr{
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.score{
    font-weight:bold;
    color:#10b981;
}

.btn{
    padding:8px 12px;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>Student Results</h2>

<table class="table">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Exam</th>
        <th>Score</th>
        <th>Date</th>
    </tr>

  {% for a in attempts %}
<tr>
    <td>{{ a.entered_name }}</td>
    <td>{{ a.entered_email }}</td>
    <td>{{ a.entered_phone }}</td>
    <td>{{ a.exam.title }}</td>
    <td class="score" style="color:{% if a.score > 0 %}#10b981{% else %}#ef4444{% endif %}">
        {{ a.score }}
    </td>
    <td>{{ a.submitted_at|date:"F d, Y, h:i A" }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="6">No results found.</td>
</tr>
{% endfor %}
  
</table>

<br>

<a href="/dashboard/" class="btn">Back to Dashboard</a>

</div>

</body>
</html>
